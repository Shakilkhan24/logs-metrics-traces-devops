name: shopsphere-phase3

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_local
      POSTGRES_DB: shopsphere
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/shopsphere.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/shopsphere.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
