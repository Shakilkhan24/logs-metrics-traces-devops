name: shopsphere

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

# One Python build recipe, with distinct tags to avoid concurrent export races.
x-python: &python
  build:
    context: .
    dockerfile: app/Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [app]
  logging: *logging

x-database-environment: &database-environment
  # Local lab credentials; production secret management is a later concern.
  DATABASE_URL: postgresql+psycopg://shopsphere:shopsphere_local@postgres:5432/shopsphere

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere_local
      POSTGRES_DB: shopsphere
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/shopsphere.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/shopsphere.conf"]
    healthcheck:
      # TCP avoids the temporary socket-only server during image initialization.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shopsphere", "-d", "shopsphere"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [app]
    logging: *logging

  db-init:
    <<: *python
    image: shopsphere-db-init:0.7.0
    command: ["python", "-m", "app.database"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment:
    <<: *python
    image: shopsphere-payment:0.7.0
    command: ["python", "-m", "uvicorn", "payment.main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 35s

  api:
    <<: *python
    image: shopsphere-api:0.7.0
    # The API has no host port. All peers on this lab network are trusted.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *database-environment
      PAYMENT_BASE_URL: http://payment:8001
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-2}
    depends_on:
      db-init:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
    healthcheck:
      # Catalogue access checks the application and database together.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/products', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 35s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: shopsphere-nginx:0.7.0
    ports:
      - "127.0.0.1:${SHOPSPHERE_PORT:-8088}:8088"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 40s
    networks: [app]
    logging: *logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Small local lab: avoid requiring a host vm.max_map_count change.
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [telemetry]
    logging: *logging

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4@sha256:b1b4cea273350ffcb67292d7b90dd034598c1627bfa3cd0783315e9237dbe737
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped
    networks: [telemetry]
    logging: *logging

  elastic-setup:
    image: python:3.12.15-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
    command: ["python", "-B", "/setup/bootstrap.py"]
    volumes:
      - ./elasticsearch:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    networks: [telemetry]
    logging: *logging

  elastic-agent:
    build:
      context: .
      dockerfile: elastic/Dockerfile
    image: shopsphere-elastic-agent:0.6.0
    # Reading Docker's files and PostgreSQL's private log directory needs root.
    user: root
    environment:
      FLEET_ENROLL: "0"
      STATE_PATH: /usr/share/elastic-agent/state
      SHOPSPHERE_PROJECT: ${COMPOSE_PROJECT_NAME:-shopsphere}
    volumes:
      - docker_logs:/var/log/docker:ro
      - type: volume
        source: postgres_data
        target: /var/log/postgresql
        read_only: true
        volume:
          subpath: 18/docker/log
      - elastic_agent_state:/usr/share/elastic-agent/state
    depends_on:
      postgres:
        condition: service_healthy
      elastic-setup:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6791/liveness?failon=degraded"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [telemetry]
    logging: *logging

  metrics-db-init:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-f", "/setup/metrics-role.sql"]
    environment:
      PGHOST: postgres
      PGUSER: shopsphere
      PGPASSWORD: shopsphere_local
      PGDATABASE: shopsphere
    volumes:
      - ./postgres/metrics-role.sql:/setup/metrics-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    networks: [app]
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    command: ["--nginx.scrape-uri=http://nginx:8089/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    networks: [app]
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command: ["--config.file=/etc/postgres_exporter.yml", "--collection-timeout=3s"]
    environment:
      DATA_SOURCE_URI: postgres:5432/shopsphere?sslmode=disable&connect_timeout=2
      DATA_SOURCE_USER: shopsphere_metrics
      DATA_SOURCE_PASS: metrics_local
    volumes:
      - ./postgres/exporter.yml:/etc/postgres_exporter.yml:ro
    depends_on:
      metrics-db-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks: [app]
    logging: *logging

  node-exporter:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
    image: shopsphere-node-exporter:0.7.0
    init: true
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --collector.diskstats
      - --collector.uname
    volumes:
      # Non-recursive existing source view; stat measures its storage filesystem.
      - docker_logs:/docker-storage:ro
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /textfile:uid=65534,gid=65534,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks: [telemetry]
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    networks: [app, telemetry]
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-shopsphere_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    networks: [telemetry]
    logging: *logging

networks:
  app:
    driver: bridge
  telemetry:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  docker_logs:
    external: true
    name: ${DOCKER_LOG_VOLUME:-shopsphere_docker_logs}
  postgres_data:
  elasticsearch_data:
  elastic_agent_state:
