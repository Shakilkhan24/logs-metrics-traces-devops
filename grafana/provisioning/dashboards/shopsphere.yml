apiVersion: 1
providers:
  - name: ShopSphere
    folder: ShopSphere
    folderUid: shopsphere
    type: file
    disableDeletion: false
    allowUiUpdates: false
    # Polling also detects changes on WSL/Windows bind mounts.
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
