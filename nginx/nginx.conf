# Phase 4: a dedicated, unprivileged instance. All paths use nginx/ as the prefix.
worker_processes 1;
pid runtime/nginx.pid;
error_log runtime/error.log warn;
worker_shutdown_timeout 35s;

events {
    worker_connections 512;
}

http {
    default_type application/octet-stream;
    server_tokens off;

    # Keep temporary files inside this lab, including on packaged Linux builds.
    client_body_temp_path runtime/client_body;
    proxy_temp_path runtime/proxy;
    fastcgi_temp_path runtime/fastcgi;
    uwsgi_temp_path runtime/uwsgi;
    scgi_temp_path runtime/scgi;

    # Match the API's request-ID policy; invalid or missing values get a new ID.
    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
    }

    # Error logs contain *connection IDs, so record them in the access log too.
    # Optional upstream values can be empty or '-', so keep them JSON strings.
    log_format shopsphere_json escape=json
        '{"time":"$time_iso8601","service":"nginx",'
        '"event":"proxy.request","request_id":"$correlation_id",'
        '"connection":"$connection","connection_requests":$connection_requests,'
        '"method":"$request_method","path":"$uri",'
        '"status_code":$status,"bytes_sent":$body_bytes_sent,'
        '"request_duration_seconds":$request_time,'
        '"upstream_address":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_seconds":"$upstream_connect_time",'
        '"upstream_header_seconds":"$upstream_header_time",'
        '"upstream_response_seconds":"$upstream_response_time"}';
    access_log runtime/access.jsonl shopsphere_json;

    upstream shopsphere_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8088;
        server_name localhost;
        client_max_body_size 1m;
        client_body_timeout 15s;
        keepalive_timeout 15s;

        # Return one ID even for errors generated before the API can be reached.
        add_header X-Request-ID $correlation_id always;

        location = /proxy-health {
            default_type application/json;
            return 200 '{"service":"nginx","status":"ok"}\n';
        }

        location / {
            # No URI suffix: preserve the original route and query parameters.
            proxy_pass http://shopsphere_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            # This is the entry proxy: replace caller-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Forwarded "";
            proxy_hide_header X-Request-ID;

            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_intercept_errors off;
            # Do not replay a failed checkout against another upstream.
            proxy_next_upstream off;
            proxy_redirect off;
        }
    }
}
