# Phase 4: a dedicated, unprivileged instance. All paths use nginx/ as the prefix.
worker_processes 1;
pid runtime/nginx.pid;
error_log runtime/error.log warn;
worker_shutdown_timeout 35s;

events {
    worker_connections 512;
}

http {
    include includes/http.conf;

    # Keep temporary files inside this lab, including on packaged Linux builds.
    client_body_temp_path runtime/client_body;
    proxy_temp_path runtime/proxy;
    fastcgi_temp_path runtime/fastcgi;
    uwsgi_temp_path runtime/uwsgi;
    scgi_temp_path runtime/scgi;

    access_log runtime/access.jsonl shopsphere_json;

    upstream shopsphere_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8088;
        include includes/server.conf;
    }
}
