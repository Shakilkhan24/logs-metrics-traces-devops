server_name localhost;
client_max_body_size 1m;
client_body_timeout 15s;
keepalive_timeout 15s;

# Return one ID even for errors generated before the API can be reached.
add_header X-Request-ID $correlation_id always;

location = /proxy-health {
    default_type application/json;
    return 200 '{"service":"nginx","status":"ok"}\n';
}

location / {
    # No URI suffix: preserve the original route and query parameters.
    proxy_pass http://shopsphere_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $correlation_id;
    # Forward W3C context; the Python SDK validates it and creates server spans.
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the entry proxy: replace caller-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";
    proxy_hide_header X-Request-ID;

    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    # Do not replay a failed checkout against another upstream.
    proxy_next_upstream off;
    proxy_redirect off;
}
