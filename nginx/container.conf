# Phase 5 container: non-root, foreground execution, Docker DNS and log streams.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 35s;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/http.conf;
    access_log /dev/stdout shopsphere_json;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Refresh the peer when Compose replaces an API container at a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream shopsphere_api {
        zone shopsphere_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8088;
        include /etc/nginx/includes/server.conf;
    }

    # Exporter-only listener: no host port is published for 8089.
    server {
        listen 8089;
        access_log off;
        location = /stub_status { stub_status; }
        location / { return 404; }
    }
}
